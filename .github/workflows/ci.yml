name: CI

# Lightweight CI: install deps, lint, run the fast test suite.
# Heavy training/evaluation is NOT run in CI (needs a GPU and the dataset).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false            # skip large LFS artifacts in CI

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU PyTorch + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check . --output-format=github || true

      - name: Format check (ruff)
        run: ruff format --check . || true

      - name: Run tests
        run: pytest -q
