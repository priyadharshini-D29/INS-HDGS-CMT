# -----------------------------------------------------------------------------
# Learning-rate scheduler configuration.
# The headline runs use early stopping (patience=50) with a plateau scheduler;
# adjust to cosine/step for sweeps.
# -----------------------------------------------------------------------------
scheduler:
  name: reduce_on_plateau    # reduce_on_plateau | cosine | step | none
  mode: max                  # monitor balanced accuracy (higher is better)
  factor: 0.5                # LR multiplier on plateau
  patience: 15               # scheduler patience (epochs) < early-stop patience
  min_lr: 1.0e-6

  # Alternative schedulers (used only when scheduler.name matches)
  cosine:
    t_max: 250
    eta_min: 1.0e-6
  step:
    step_size: 50
    gamma: 0.5
