# =============================================================================
# Conda environment for INS-HDGS-CMT.
#
#   conda env create -f environment.yml
#   conda activate ins-hdgs-cmt
#
# NOTE on PyTorch: install torch AFTER creating the env, matching your CUDA
# version, so the wheel tag resolves against PyTorch's per-CUDA index rather
# than defaulting to a CPU build:
#   GPU:  pip install torch --index-url https://download.pytorch.org/whl/cu124
#   CPU:  pip install torch
# Pinned versions mirror requirements.txt.
# =============================================================================
name: ins-hdgs-cmt
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Core scientific stack
      - numpy==2.4.6
      - pandas==3.0.3
      - scipy==1.17.1
      - scikit-learn==1.8.0
      - joblib==1.5.3
      - networkx==3.6.1
      # Signal processing / EEG-ET
      - mne==1.12.1
      - pyxdf==1.17.4
      - antropy==0.2.2
      # Vision / image handling
      - opencv-python==4.13.0.92
      - pillow==12.2.0
      # Tabular baselines
      - catboost==1.2.10
      - xgboost==3.2.0
      # Plotting
      - matplotlib==3.10.9
      - seaborn==0.13.2
      # I/O
      - openpyxl==3.1.5
      # Misc
      - tqdm==4.67.3
      # Optional (diagnostic/analysis plots)
      - umap-learn==0.5.7
      - torch-geometric
      # Dev / test
      - pytest
      - ruff
